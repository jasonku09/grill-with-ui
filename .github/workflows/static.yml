name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every script
        run: |
          for f in server.mjs markdown.mjs test/*.mjs design/record-demo.mjs; do
            node --check "$f"
          done
      - name: Page stays dependency-free (no external fetches)
        run: |
          if grep -En "src=[\"']http|href=[\"']http|fonts\.googleapis|fetch\s*\(\s*[\"']https?://|url\(\s*[\"']?https?://|@import" page.html; then
            echo "page.html must not fetch external resources (system fonts only, works offline)"
            exit 1
          fi

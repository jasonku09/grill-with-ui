name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-save @playwright/test@1
      - run: npx playwright install --with-deps chromium
      - run: node test/page.e2e.mjs
      - run: node test/manual-visual.e2e.mjs
